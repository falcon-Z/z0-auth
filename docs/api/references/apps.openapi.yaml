openapi: 3.1.0
info:
  title: z0-auth Applications API
  version: 0.1.0
  description: Applications own membership, subjects, scopes, display metadata and
    minimum assurance. Child OAuth clients own protocol configuration. All routes
    require a signed-in operator with the indicated RBAC scope. Mutations require
    CSRF; client mutations also preserve privileged verification.
servers:
- url: http://localhost:3000
tags:
- name: Applications
paths:
  /api/v1/apps:
    get:
      tags:
      - Applications
      summary: List applications
      operationId: listApps
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Applications for this instance
          content:
            application/json:
              schema:
                type: object
                required:
                - apps
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppSummary'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
    post:
      tags:
      - Applications
      summary: Register application
      operationId: createApp
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        '201':
          description: Application created atomically with its initial child client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppResponse'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
  /api/v1/apps/{appId}:
    get:
      tags:
      - Applications
      summary: Get application
      operationId: getApp
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
    patch:
      tags:
      - Applications
      summary: Update application
      operationId: patchApp
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAppRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
  /api/v1/apps/{appId}/scopes:
    get:
      tags:
      - Applications
      summary: List application scopes
      operationId: listAppScopes
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Scopes registered for the application
          content:
            application/json:
              schema:
                type: object
                required:
                - scopes
                properties:
                  scopes:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppScopeSummary'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
    post:
      tags:
      - Applications
      summary: Register application scope
      operationId: createAppScope
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppScopeRequest'
      responses:
        '201':
          description: Scope created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppScopeSummary'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Scope name already exists for this application
  /api/v1/apps/{appId}/scopes/{scopeId}:
    patch:
      tags:
      - Applications
      summary: Update application scope
      operationId: patchAppScope
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ScopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAppScopeRequest'
      responses:
        '200':
          description: Scope updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppScopeSummary'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Scope name already exists for this application
    delete:
      tags:
      - Applications
      summary: Delete application scope
      operationId: deleteAppScope
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ScopeId'
      responses:
        '200':
          description: Scope deleted
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
  /api/v1/apps/{appId}/clients:
    get:
      tags:
      - Applications
      summary: List client clients
      operationId: listAppClients
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Child clients; no secret material
          content:
            application/json:
              schema:
                type: object
                required:
                - clients
                properties:
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthClientSummary'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
    post:
      tags:
      - Applications
      summary: Create client client
      operationId: createAppClient
      description: Returns `clientSecret` once; it cannot be retrieved again.
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client configuration and one-time plaintext secret (null for
            public clients)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Application disabled
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
  /api/v1/apps/{appId}/clients/{clientId}:
    patch:
      tags:
      - Applications
      summary: Manage child client
      operationId: patchAppClient
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientSummary'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Client unavailable or parent Application disabled
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
      description: Requires apps.clients:update. Public/confidential class, purpose
        and identity are immutable. Status may be active or disabled; deletion is
        a separate lifecycle capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchClientRequest'
  /api/v1/apps/{appId}/clients/{clientId}/secrets:
    get:
      tags: [Applications]
      summary: List safe metadata for every Client secret
      operationId: listClientSecrets
      description: Requires apps.clients:read. Values and digests are never returned. Public clients return an empty list. Responses use Cache-Control no-store.
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Secret metadata, with expiry evaluated at read time
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientSecretSummary'
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
    post:
      tags: [Applications]
      summary: Add an independent confidential Client secret
      operationId: createClientSecret
      description: >-
        Requires apps.clients:rotate, CSRF and recent privileged verification.
        Client and Application must be active and Client must be confidential.
        Does not replace or revoke existing secrets. Returns the generated value
        only once with Cache-Control no-store. No expiry is imposed by default.
        replacementFor records a same-Client audit relationship only.
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientSecretRequest'
      responses:
        '201':
          description: Independent secret metadata and one-time value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientSecretResponse'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Public Client or unavailable Client/Application
  /api/v1/apps/{appId}/clients/{clientId}/secrets/{secretId}/revoke:
    post:
      tags: [Applications]
      summary: Permanently revoke an individual Client secret
      operationId: revokeClientSecret
      description: >-
        Requires apps.clients:revoke, CSRF and recent privileged verification.
        Ordinary revocation of an active Client's last usable secret returns 409
        with code last_usable_secret and explains the outage. Add and deploy a
        replacement first. Compromised revocation can revoke the final secret
        immediately. Expired alternatives do not count as usable. Disabled or
        Pending Deletion registrations may revoke their last secret ordinarily.
        Retrying an already-completed revocation returns existing metadata.
        Revocation stops future authentication and is rechecked during token
        issuance; already-issued access tokens expire normally. Responses use no-store.
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ClientId'
      - name: secretId
        in: path
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [ordinary, compromised] }
      responses:
        '200':
          description: Revoked secret metadata; never contains its value or digest
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret:
                    $ref: '#/components/schemas/ClientSecretSummary'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Ordinary revocation requires another usable secret for this active Client
  /api/v1/registration-lifecycle-policy:
    get:
      summary: Read the configured registration deletion grace period
      operationId: getRegistrationLifecyclePolicy
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Requires apps:read
          content:
            application/json:
              schema:
                type: object
                required: [graceDays]
                properties:
                  graceDays: { type: integer, minimum: 0, maximum: 365 }
  /api/v1/apps/{appId}/lifecycle:
    post:
      summary: Schedule deletion, restore, or permanently purge an Application
      operationId: changeApplicationLifecycle
      description: >-
        Requires apps:delete, CSRF and fresh verification. Delete and purge require
        exact confirmation and a one-use action/session/registration-bound verification
        challenge. A 403 response supplies registrationVerification and reauthentication
        instructions; verify then retry with X-Registration-Verification. Restore requires
        Pending Deletion before the stored recovery deadline. Purge requires Pending
        Deletion and a separate fresh proof. Zero configured grace immediately purges.
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - name: X-Registration-Verification
        in: header
        required: false
        schema: { type: string }
        description: One-use verification challenge returned by this action's first request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationLifecycleRequest'
      responses:
        '200':
          description: Lifecycle changed; registration is null after physical purge
          content:
            application/json:
              schema:
                type: object
                required: [status, registration]
                properties:
                  status: { type: string, enum: [active, pending_deletion, purged] }
                  registration:
                    oneOf:
                    - $ref: '#/components/schemas/AppDetail'
                    - type: 'null'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Invalid transition, expired recovery period or unavailable parent Application
  /api/v1/apps/{appId}/clients/{clientId}/lifecycle:
    post:
      summary: Schedule deletion, restore, or permanently purge a Client
      operationId: changeClientLifecycle
      description: >-
        Requires apps.clients:delete, CSRF and fresh verification. Delete and purge require
        exact confirmation and a one-use action/session/registration-bound verification
        challenge. A 403 response supplies registrationVerification and reauthentication
        instructions; verify then retry with X-Registration-Verification. Restore requires
        Pending Deletion before the stored recovery deadline. Purge requires Pending
        Deletion and a separate fresh proof. Zero configured grace immediately purges.
      security:
      - CsrfHeader: []
        CsrfCookie: []
        SessionCookie: []
      parameters:
      - $ref: common.openapi.yaml#/components/parameters/CsrfHeader
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ClientId'
      - name: X-Registration-Verification
        in: header
        required: false
        schema: { type: string }
        description: One-use verification challenge returned by this action's first request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationLifecycleRequest'
      responses:
        '200':
          description: Lifecycle changed; registration is null after physical purge
          content:
            application/json:
              schema:
                type: object
                required: [status, registration]
                properties:
                  status: { type: string, enum: [active, pending_deletion, purged] }
                  registration:
                    oneOf:
                    - $ref: '#/components/schemas/OAuthClientSummary'
                    - type: 'null'
        '400':
          $ref: common.openapi.yaml#/components/responses/ValidationError
        '401':
          $ref: common.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: common.openapi.yaml#/components/responses/NotFound
        '409':
          description: Invalid transition, expired recovery period or unavailable parent Application
components:
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScopeId:
      name: scopeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Child client record UUID (distinct from its protocol client_id)
  schemas:
    AppScopeSummary:
      type: object
      required:
      - id
      - appId
      - name
      - description
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        name:
          type: string
          description: Lowercase scope identifier (e.g. `read:orders`, `openid`).
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAppScopeRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    PatchAppScopeRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    AppStatus:
      type: string
      enum:
      - active
      - disabled
      - pending_deletion
    Assurance:
      type: string
      enum:
      - baseline
      - strong
    ClientStatus:
      type: string
      enum:
      - active
      - disabled
      - pending_deletion
      - purged
    AppClientType:
      type: string
      enum:
      - public
      - confidential
      description: Immutable security class of one Client.
    ClientPurpose:
      type: string
      enum:
      - interactive
      - workload
      description: Immutable purpose; workload clients must be confidential.
    AppSummary:
      type: object
      required:
      - id
      - name
      - slug
      - status
      - minimumAssurance
      - activeClientCount
      - createdAt
      - updatedAt
      - disabledAt
      - deletionStartedAt
      - purgeAfter
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/AppStatus'
        minimumAssurance:
          $ref: '#/components/schemas/Assurance'
        activeClientCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disabledAt:
          type:
          - string
          - 'null'
          format: date-time
        deletionStartedAt:
          type: [string, 'null']
          format: date-time
        purgeAfter:
          type: [string, 'null']
          format: date-time
          description: Stored recovery deadline; restoration is disallowed after this time
    AppDetail:
      $ref: '#/components/schemas/AppSummary'
    OAuthClientSummary:
      type: object
      required:
      - id
      - appId
      - clientId
      - label
      - clientType
      - purpose
      - status
      - redirectUris
      - browserOrigins
      - refreshEnabled
      - assuranceOverride
      - effectiveAssurance
      - createdAt
      - updatedAt
      - disabledAt
      - deletionStartedAt
      - purgeAfter
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        clientId:
          type: string
        label:
          type: string
        clientType:
          $ref: '#/components/schemas/AppClientType'
        purpose:
          $ref: '#/components/schemas/ClientPurpose'
        status:
          $ref: '#/components/schemas/ClientStatus'
        redirectUris:
          type: array
          items:
            type: string
            format: uri
        browserOrigins:
          type: array
          items:
            type: string
          description: Exact browser origins registered separately; only public interactive
            clients.
        refreshEnabled:
          type: boolean
        assuranceOverride:
          type:
          - string
          - 'null'
          enum:
          - baseline
          - strong
          - null
        effectiveAssurance:
          $ref: '#/components/schemas/Assurance'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disabledAt:
          type:
          - string
          - 'null'
          format: date-time
        deletionStartedAt:
          type: [string, 'null']
          format: date-time
        purgeAfter:
          type: [string, 'null']
          format: date-time
          description: Stored recovery deadline; restoration is disallowed after this time
    CreateClientRequest:
      type: object
      additionalProperties: false
      required:
      - label
      - clientType
      - purpose
      properties:
        label: &id001
          type: string
          minLength: 1
          maxLength: 64
        clientType:
          $ref: '#/components/schemas/AppClientType'
        purpose:
          $ref: '#/components/schemas/ClientPurpose'
        redirectUris: &id002
          type: array
          items:
            type: string
            format: uri
          description: Required, nonempty for interactive clients; empty for workloads.
        browserOrigins: &id003
          description: Up to 20 exact HTTPS origins, or loopback HTTP origins; no paths, query, fragments, wildcards or trailing slashes. Only public interactive Clients; defaults to empty and never inferred from redirects.
          maxItems: 20
          type: array
          items:
            type: string
        refreshEnabled: &id004
          type: boolean
          default: false
        assuranceOverride: &id005
          type:
          - string
          - 'null'
          enum:
          - baseline
          - strong
          - null
          description: May strengthen the Application minimum; cannot weaken it.
    CreateClientResponse:
      type: object
      required:
      - client
      - clientSecret
      - secret
      properties:
        client:
          $ref: '#/components/schemas/OAuthClientSummary'
        secret:
          oneOf:
          - $ref: '#/components/schemas/ClientSecretSummary'
          - type: 'null'
          description: Safe metadata for the initial secret. Null for public clients.
        clientSecret:
          type:
          - string
          - 'null'
          description: Returned once. Null for public clients.
    CreateAppRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - initialClient
      properties:
        name:
          type: string
        minimumAssurance:
          type: string
          enum:
          - baseline
          - strong
          default: baseline
        initialClient:
          $ref: '#/components/schemas/CreateClientRequest'
    CreateAppResponse:
      type: object
      required:
      - app
      - client
      - clientSecret
      - secret
      properties:
        app:
          $ref: '#/components/schemas/AppDetail'
        client:
          $ref: '#/components/schemas/OAuthClientSummary'
        secret:
          oneOf:
          - $ref: '#/components/schemas/ClientSecretSummary'
          - type: 'null'
          description: Safe metadata for the initial secret. Null for public clients.
        clientSecret:
          type:
          - string
          - 'null'
    PatchAppRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        minimumAssurance:
          $ref: '#/components/schemas/Assurance'
    PatchClientRequest:
      type: object
      additionalProperties: false
      properties:
        label: *id001
        redirectUris: *id002
        browserOrigins: *id003
        refreshEnabled: *id004
        assuranceOverride: *id005
        status:
          type: string
          enum: [active, disabled]
    RegistrationLifecycleRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [delete, restore, purge] }
        confirmation:
          type: string
          description: Exact Application UUID or public Client ID; mandatory for delete and purge
        expectedGraceDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Mandatory for delete; must match the reviewed current policy and is bound into its verification challenge
    ClientSecretSummary:
      type: object
      additionalProperties: false
      required: [id, clientId, label, status, createdAt, createdBy, expiresAt, lastUsedAt, revokedAt, revokedBy, revocationReason]
      properties:
        id: { type: string, format: uuid, description: Stable non-secret identifier }
        clientId: { type: string, format: uuid, description: Parent Client record UUID }
        label: { type: [string, 'null'] }
        status: { type: string, enum: [active, expired, revoked] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, 'null'], format: uuid, description: Null when the creator is unknown or removed }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time, description: Last successful Client authentication; failed attempts do not update it }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'], format: uuid }
        revocationReason: { type: [string, 'null'], enum: [ordinary, compromised, null] }
    CreateClientSecretRequest:
      type: object
      additionalProperties: false
      properties:
        label: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        expiresAt: { type: [string, 'null'], format: date-time, description: Future RFC 3339 timestamp or null for no expiry }
        replacementFor: { type: string, format: uuid, description: Optional same-Client secret ID for the audit relationship }
    CreateClientSecretResponse:
      type: object
      required: [secret, clientSecret]
      properties:
        secret:
          $ref: '#/components/schemas/ClientSecretSummary'
        clientSecret:
          type: string
          description: Generated value returned only in this creation response
